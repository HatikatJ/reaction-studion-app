<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>🎬 Reaction Studio</h1>
    <span class="badge">v1.1.0</span>
  </header>

  <main class="studio-container">
    <!-- Zone de prévisualisation vidéo -->
    <section class="video-preview-card">
      <div class="video-wrapper">
        <video id="mainVideo" class="video-player" playsinline controls></video>
        <video id="webcamVideo" class="webcam-overlay" autoplay playsinline muted></video>
      </div>
    </section>

    <!-- Panneau de commandes -->
    <section class="controls-card">
      <h2>Contrôles & Réglages</h2>
      
      <div class="control-group">
        <label for="videoInput" class="btn btn-primary">
          📂 Charger une vidéo
        </label>
        <input type="file" id="videoInput" accept="video/*" hidden>
      </div>

      <div class="control-group">
        <button id="toggleWebcamBtn" class="btn btn-secondary">
          📷 Activer la webcam
        </button>
      </div>

      <div class="control-group">
        <label for="webcamPosition">Position de la webcam :</label>
        <select id="webcamPosition" class="select-input">
          <option value="bottom-right">Bas Droite</option>
          <option value="bottom-left">Bas Gauche</option>
          <option value="top-right">Haut Droite</option>
          <option value="top-left">Haut Gauche</option>
        </select>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
