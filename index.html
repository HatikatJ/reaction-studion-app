<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>🎬 Reaction Studio</h1>
    <span class="badge">v1.2.0</span>
  </header>

  <main class="studio-container">
    <!-- Zone de prévisualisation vidéo -->
    <section class="video-preview-card">
      <div class="video-wrapper" id="videoWrapper">
        <video id="mainVideo" class="video-player" playsinline controls></video>
        <video id="webcamVideo" class="webcam-overlay" autoplay playsinline muted></video>
      </div>
    </section>

    <!-- Panneau de commandes -->
    <section class="controls-card">
      <h2>Contrôles</h2>
      
      <div class="control-group">
        <label for="videoInput" class="btn btn-primary">
          📂 Charger une vidéo
        </label>
        <input type="file" id="videoInput" accept="video/*" hidden>
      </div>

      <div class="control-group">
        <button id="toggleWebcamBtn" class="btn btn-secondary">
          📷 Activer la webcam
        </button>
      </div>

      <p class="hint">💡 <em>Astuce : Une fois la webcam activée, glisse-la sur la vidéo avec la souris ou ton doigt pour la placer où tu veux !</em></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
